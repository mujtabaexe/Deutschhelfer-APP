# Static analysis for Deutschhelfer. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Missing return values and unawaited futures hide real bugs.
    missing_return: error
    unawaited_futures: warning
  exclude:
    - build/**
    - lib/l10n/app_localizations*.dart
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
